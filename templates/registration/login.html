{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Log in" %} — Starbase Spotters{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <h1 class="h3 mb-3">{% translate "Log in" %}</h1>
    <form method="post">
      {% include "includes/form.html" %}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary w-100">{% translate "Log in" context "button" %}</button>
    </form>
    <p class="mt-3 text-body-secondary">{% translate "No account?" %} <a href="{% url 'signup' %}">{% translate "Sign up" %}</a></p>
  </div>
</div>
{% endblock %}
